  <rect width="1200" height="430" fill="#080808"/>
  <g fill="#fff" font-family="Impact, 'Arial Narrow', 'Helvetica Neue', sans-serif" font-weight="900" font-size="214" letter-spacing="-6">
    <text x="28" y="195" textLength="810" lengthAdjust="spacingAndGlyphs">OUT OF</text>
    <text x="265" y="395" textLength="900" lengthAdjust="spacingAndGlyphs">OFFICE</text>
  </g>
</svg>
